<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FleetFlow — vehicles, maintenance, documents and drivers in one place."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1520" media="(prefers-color-scheme: dark)" />

    <!--
      The mark: a rounded square carrying two stacked motion strokes. Inlined as
      a data URI so the tab icon costs no request and no build step.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2301566d'/%3E%3Cpath d='M8 12h16M8 20h10' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='20' r='2.5' fill='%2338d0ef'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>FleetFlow</title>

    <script>
      /*
       * Theme, applied before first paint.
       *
       * Without this the page renders light and then flips, which is worse than
       * having no dark mode at all. It reads the same key `lib/theme.ts` writes;
       * the two must agree, so neither invents its own storage name.
       */
      (function () {
        try {
          var stored = localStorage.getItem('fleetflow.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          /* Private browsing denies localStorage; the light default is fine. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
