name: CI

# Every push to main and every pull request. Configure `verify` as a required
# status check in branch protection to satisfy FF-106's "merge blocked on green"
# — that setting lives in the repository, not in this file.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Integration tests talk to a real Postgres and Redis for the same reason
    # they do locally: the behaviour under test is the SQL Prisma generates and
    # the health probe's actual reachability, neither of which a mock can prove.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetflow
          POSTGRES_DB: fleetflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetflow -d fleetflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://fleetflow:fleetflow@localhost:5432/fleetflow?schema=public
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      # CI-only, and never a real secret: this workflow signs nothing that
      # leaves the runner. Real environments generate their own (see .env.example).
      JWT_SECRET: ci-only-insecure-secret-not-used-anywhere-real
      # Supabase and SMTP are deliberately left unset. FF-102's feature tier
      # allows that outside production, and CI exercising the "unconfigured"
      # path is worth more than CI pretending the services exist.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install`: fails if package-lock.json and package.json disagree,
      # so a dependency added without committing the lockfile is caught here.
      - name: Install dependencies
        run: npm ci

      # The generated client is a typecheck input, so this precedes everything.
      - name: Generate Prisma client
        run: npx prisma generate

      # Both apps import @fleetflow/shared from its build output; on a fresh
      # clone `dist/` does not exist yet.
      - name: Build shared contract
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Proves the seed stays runnable and idempotent — it is the fastest way to
      # notice that a schema change broke the demo data everyone develops against.
      - name: Seed, twice (idempotency)
        run: |
          npm run db:seed
          npm run db:seed

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
